# CornerWindow defaults. Every option lives here, documented.
#
# Override any of it in ~/.config/cornerwindow/config.toml (only the keys you change),
# or add a per-PC file in config/machines/ with a [match] table.
# Tables merge; lists and values replace.

[general]
corner = "top-right"          # top-left | top-right | bottom-left | bottom-right
monitor = "primary"           # "primary", a monitor index (0, 1…) or part of its model name
open_on = "click"             # click | hover
hover_open_delay_ms = 250     # only for open_on = "hover"
close_on_focus_out = true     # clicking anywhere else closes the island
close_on_leave_ms = 0         # >0: also close after the pointer has left for this long
hide_when_fullscreen = true   # get out of the way of games and videos
always_on_top = false         # true: stay above every window, fullscreen apps included (overrides hide_when_fullscreen)
window_type = "utility"       # X11 window type: utility | dock (try dock if the WM misbehaves)

[trigger]
radius = 20                   # the quarter-circle at rest, px
hover_radius = 26             # grows to this under the pointer
# Gestures on the collapsed trigger, bound to named actions (`cornerwindow actions` lists them)
scroll = "display.brightness.step"
shift_scroll = "audio.volume.step"
middle_click = "audio.mute"
right_click = "media.play_pause"

[panel]
background = "#000000"
column_width = 330
spacing = 10
padding = 14
corner_radius = 28            # the inner corner of the open panel
ears = 10                     # where the panel meets the screen edges: >0 flares out, <0 rounds in, 0 = square
smoothing = 0.6               # 0 = circular corners, 0.6 = iOS-like continuous corners
shadow = true
glass = false                 # Liquid Glass theme instead of the black island (see [glass])
density = "comfortable"       # comfortable | compact (tighter cards, smaller big numbers)

[glass]
# Liquid Glass bends the live backdrop like a lens at its rim instead of just blurring it.
# Needs a C compiler once (the pixel kernel is built into ~/.cache/cornerwindow).
appearance = "system"         # system (follow light/dark) | light | dark | adaptive (by what's behind)
frost = 0.5                   # 0 = clear glass … 1 = frosted
tint = 0.5                    # 0 … 1: more tint = easier to read, less see-through
refraction = 1.0              # strength of the lensing at the rim (0 = none)
dispersion = 0.3              # colour fringing where the light bends most
light_angle = -45             # where the light comes from, degrees: 0 = top, -90 = left, 90 = right
live = true                   # X11: follow what moves behind the glass (false = wallpaper only)

[animation]
# Springs use SwiftUI semantics: response = seconds, damping < 1 = a little bounce.
open_response = 0.42
open_damping = 0.78
open_height_response = 0.5
content_response = 0.55
close_response = 0.30
close_damping = 1.0
content_out_response = 0.12
hover_response = 0.25
hover_damping = 0.9
stagger = 0.11                # delay between cards as they pour out of the corner
slow_motion = 1.0             # >1 slows every animation down (great for tuning)

[modules]
top = ["commandbar", "windows"]   # windows = the Apps strip, shown while the taskbar is hidden (see [windows])
# Columns left -> right, cards top -> bottom. Any module id works anywhere. Several cards show
# only while they have something to show: drives, notifications, downloads, battery, updates.
# Also available: power (a card; the clock has a power button instead), weather, agents.
columns = [
  ["display", "audio", "media", "drives", "glance", "downloads", "updates"],
  ["header", "toggles", "notifications", "battery", "drawer"],
]
drawer = ["timer", "stopwatch", "clipboard", "notes", "shelf"]
# Tools have no card: they add commands to the bar (and actions). Also available: alerts.
tools = ["capture", "windowtools", "snippets", "processes"]
hidden = []                   # switched off: they keep their place above but aren't shown
search_paths = []             # extra folders with your own module .py files

[commandbar]
always_show = true            # keep the bar (and its ? button) visible; false = it appears when you type
apps = true                   # typing an app's name offers to open it
windows = true                # ...and to switch to its open windows
path_programs = true          # "htop" offers to run a program from your PATH in a terminal
terminal = ""                 # for ">> cmd" and PATH programs: "kitty", "konsole"…; "" = first one installed
search_url = "https://duckduckgo.com/?q={}"   # last row: search the web ({} = what you typed; "" = off)
currency_url = "https://api.frankfurter.dev/v1/latest?base=EUR"   # "100 usd to eur" (fetched when asked, cached 12 h; "" = off)

[commandbar.engines]          # search shortcuts: "yt lofi" searches YouTube ({} = the rest of the line)
g = "https://www.google.com/search?q={}"
yt = "https://www.youtube.com/results?search_query={}"
w = "https://en.wikipedia.org/wiki/Special:Search?search={}"
gh = "https://github.com/search?q={}"
maps = "https://www.openstreetmap.org/search?query={}"

[display]
backend = "auto"              # auto | ddc | ddcutil | backlight | gamma   (or a list, in order)
night_chip = "auto"           # a Night light chip with the presets: auto (only without the Night quick toggle) | true | false
# i2c_bus = 4                 # skip detection and talk to /dev/i2c-N directly
step = 5                      # % per scroll notch
refresh_on_open = true        # re-read values (in case you used the monitor's buttons)
limits = {}                   # hard ceilings in %, e.g. { brightness = 30, contrast = 30 }; sliders span 0..limit

[[display.presets]]
name = "Day"
brightness = 80
contrast = 60
night_light = false

[[display.presets]]
name = "Evening"
brightness = 45
contrast = 50
night_light = true

[[display.presets]]
name = "Night"
brightness = 15
contrast = 45
night_light = true

[[display.presets]]
name = "Movie"
brightness = 60
contrast = 70
night_light = false

[audio]
backend = "auto"              # auto | wpctl | pactl
step = 5
max_volume = 100              # allow boosting by raising this (e.g. 150)
show_mic_muted = true         # red dot on the trigger while the mic is muted
names = {}                    # output device name substring -> friendly name
input_names = {}              # the same for microphones, e.g. { "Camera" = "Webcam mic" }
mixer_ignore = ["speech-dispatcher"]  # apps left out of the per-app sliders

[media]
# Any MPRIS player works: Spotify, VLC, mpv, Cider (Apple Music), KDE Connect, and browser
# tabs (YouTube, SoundCloud, Apple Music web, YouTube Music, Twitch...). MPD is spoken natively.
ignore = ["playerctld"]       # players to leave out (part of their name, e.g. "kdeconnect")
prefer = []                   # when nothing plays, show these first, e.g. ["spotify"]
mpd = "auto"                  # auto (use MPD if it answers) | false
# mpd_host = "localhost"      # default: $MPD_HOST, else localhost (a socket path works too)
# mpd_port = 6600
trigger_dot = true            # small green dot on the corner while something plays

[toggles]
# Toggles hide themselves when their service is missing (power_profile needs power-profiles-daemon,
# vpn a NetworkManager VPN or WireGuard connection). Also available: mic, glass (the Liquid
# Glass theme; also under Settings → Look).
items = ["wifi", "bluetooth", "night_light", "dark_mode", "dnd", "caffeine", "power_profile", "vpn", "airplane"]
per_row = 4
rows = 2                      # more toggles than fit in this many rows go behind a "More" tile (0 = no limit)
awake_minutes = [30, 60, 120] # the Awake toggle's picker ("awake 1h" works too)

[glance]
interval = 1.0
compact = true                # one row (CPU, GPU, memory, network); click it for sparklines, disk and processes
processes = 4                 # busiest processes listed in the full view (0 = none)
cpu_sensor = "auto"           # or "chip/label", e.g. "k10temp/Tctl" (see `cornerwindow doctor`)
gpu_sensor = "auto"
disk_path = "/"

[battery]
# Shown only when UPower reports a battery: a laptop's, or a wireless mouse, headset, controller...
low = 15                      # red dot on the corner below this % while discharging
peripherals = "low"           # mice, keyboards, headsets, controllers, phones: always | low | never
peripheral_low = 20           # "low": list a wireless device only at or below this % (the Bluetooth picker shows them all)

[header]
clock_format = "%H:%M"
date_format = "%A, %-d %B"
week_start = "monday"         # first day of the week in the calendar (click the date to open it)
next_event = true             # "Standup · in 25 min" under the date (see [calendar])
agenda = 4                    # upcoming events listed under the month calendar
power = true                  # a power button (lock, sleep, restart, shut down) when the Power card is off

[calendar]
# Events come from GNOME Calendar / Evolution (local calendars and online accounts such as Google,
# Nextcloud, Exchange), read from their files, plus any .ics files or URLs listed here.
enabled = true
evolution = true
sources = []                  # e.g. ["~/calendar.ics", "https://calendar.google.com/…/basic.ics"]
days = 7                      # how far ahead to look
refresh_minutes = 10

[notifications]
# A history of the notifications the desktop showed (it keeps showing its own banners).
size = 30                     # remembered
show = 3                      # listed before "N more"
ignore = []                   # apps to leave out (part of their name)
trigger_dot = true            # blue dot on the corner while something is unread

[downloads]
folder = ""                   # "" = your downloads folder
keep_minutes = 30             # how long a finished download stays listed
show = 3                      # finished downloads listed

[updates]
check_hours = 6               # check when the panel opens, at most this often (apt needs no network)
flatpak = true
snap = true
trigger_dot = false           # blue dot on the corner while updates are waiting

[drawer]
height = 100                  # px; a tab that needs more scrolls

[timer]
presets = [5, 15, 25]         # minutes; any other length: type "timer 10" or "t 90s"

[clipboard]
size = 10
persist = false               # keep history across restarts (stored in ~/.local/share/cornerwindow)
images = 4                    # copied images remembered (in memory only; 0 = text only)
clear_after = 0               # seconds: clear the system clipboard this long after a copy (0 = never; history keeps it)

[shelf]
size = 20                     # items kept on the shelf

[capture]
# Screenshots go to Pictures/Screenshots. Text recognition needs tesseract, QR codes zbar-tools.
copy = true                   # also copy the screenshot to the clipboard
notify = true
color_format = "hex"          # what "pick" copies: hex | rgb | hsl
ocr_language = ""             # tesseract language, e.g. "eng+deu"; "" = its default
open_qr_links = false         # open a QR code's link right away (it's always copied)
delay_ms = 350                # wait for the panel to close before capturing

[windowtools]
gap = 0                       # px between snapped windows and around them

[snippets]
paste = true                  # paste into the window you were in (needs xdotool on X11, wtype on Wayland); else copy
paste_delay_ms = 250

[snippets.items]              # ;name in the bar. {date} {time} {datetime} {weekday} {clipboard} {date:%d.%m.%Y}
today = "{date}"
now = "{datetime}"

[alerts]
# A tool that checks in the background (switch it on under Settings → Features).
interval = 15                 # seconds between checks
cpu = 90                      # % busy for `sustain` seconds (0 = off)
temperature = 90              # °C
memory = 92                   # % used
disk_gb = 5                   # free GB on [glance] disk_path
sustain = 60
cooldown = 1800               # seconds before the same alert repeats

[agents]
# Coding agents' usage from their local logs: Claude Code, Codex, OpenCode, Gemini CLI, Copilot CLI,
# Amp, pi, Goose and more. Switch the card on under Settings → Features. `cornerwindow agent setup`
# connects agents' hooks (exactly when one works or waits for you) and Claude Code's status line
# (your real 5-hour and weekly limit %); see the README.
interval = 10                 # seconds, while the panel is open
window_budget = 0             # without Claude's status line hook: tokens per 5-hour window, for a meter (0 = none)
trigger_dot = true            # dot on the corner: purple while an agent works, orange while one waits for you
hide = []                     # agents to leave out, by id or name, e.g. ["gemini", "Oh My Pi"]
herdr = true                  # ask herdr (if it runs) which of its agents work or wait for you
processes = true              # find agents with no usable logs (Cursor CLI, Aider, Kiro, Crush...) by their process

[power]
# The buttons, both on the Power card and behind the clock's power button.
items = ["lock", "suspend", "reboot", "poweroff"]
hold_ms = 600                 # hold this long to confirm
lock_hold_ms = 250

[windows]
# The Apps card: your favourite and running apps, a taskbar inside the panel. Click to switch
# (the app you're in: minimise), middle-click for a new window, right-click for its windows.
show = "auto"                 # auto (only while [experimental] hide_taskbar is on) | always
favorites = true              # also show the apps pinned to the desktop's dash / taskbar
attention_dot = true          # orange dot on the corner when a window asks for attention

[experimental]
# Not finished; may misbehave.
hide_taskbar = false          # hide the desktop's taskbar while CornerWindow runs (Zorin Taskbar,
                              # Dash to Panel, Dash to Dock, Ubuntu Dock). Comes back when CornerWindow
                              # quits; `cornerwindow taskbar show` restores it by hand.

[weather]
# Switch the Weather card on under Settings → Features, then pick your city under Settings → Weather
# (or set these yourself):
# latitude = 52.23
# longitude = 21.01
# place = "Home"
units = "metric"
forecast = "hours"            # hours | days | both | none
refresh_minutes = 15
